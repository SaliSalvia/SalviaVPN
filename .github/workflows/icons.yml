# Rebuilds every icon from app/tool/app_icons.py and commits the changed
# files. Run by hand only: Actions, Icons, Run workflow. A normal build
# never touches this; the committed icons are what the apps ship with.
name: Icons

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: icons
  cancel-in-progress: false

jobs:
  icons:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow
        run: python -m pip install --upgrade pillow
      - name: Make the icons
        working-directory: app
        run: python tool/app_icons.py
      - name: Commit the regenerated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app/assets app/android/app/src/main/res app/windows core docs
          if git diff --cached --quiet; then
            echo "Nothing to commit: the icons are up to date."
          else
            git commit -m "icons: regenerate from tool/app_icons.py"
            git push
          fi
